name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9][0-9]'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python build dependencies
        shell: pwsh
        run: python -m pip install pyinstaller PySide6 mutagen
      - name: Build portable executable
        shell: pwsh
        run: .\build.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Setup and checksum
        shell: pwsh
        run: .\build_installer.ps1 -SkipAppBuild
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Ver ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/*.exe
            release/*.zip
            release/*.sha256
